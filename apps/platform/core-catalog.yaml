apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-catalog
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 8: Depends on XRDs (Wave 7) being installed and CRDs available
    argocd.argoproj.io/sync-wave: "8"
    platform.digiorg.io/upgrade-gate: "issue-275-manual"
spec:
  project: default

  source:
    repoURL: https://github.com/digiorg/core-catalog.git
    # Core-catalog PR #30 adds initial private SonarQube project enrollment
    # (Core issue #372). Pin its independently reviewed canonical merge commit.
    # Rollout requires approved account/Secret prerequisites and live acceptance;
    # this pin alone does not establish deployment or runtime readiness.
    # Keep this manual (no syncPolicy.automated) — see docs/guides/platform-versions.md.
    targetRevision: 2867d1b4d47f472c7bb4097d61226e206e32a5a1
    path: compositions/local

  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system

  syncPolicy:
    # Manual until the v2 XRDs and pinned catalog commit are validated together.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
