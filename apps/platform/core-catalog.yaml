apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-catalog
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 8: Depends on XRDs (Wave 7) being installed and CRDs available
    argocd.argoproj.io/sync-wave: "8"
    platform.digiorg.io/upgrade-gate: "issue-275-manual"
spec:
  project: default

  source:
    repoURL: https://github.com/digiorg/core-catalog.git
    # Crossplane v2 removed native `spec.resources` Compositions. This commit
    # migrates the local catalog to function-patch-and-transform Pipeline mode.
    targetRevision: 4c30d9c3fa5c3c401c19f26b66a025854c65ee02
    path: compositions/local

  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system

  syncPolicy:
    # Manual until the v2 XRDs and pinned catalog commit are validated together.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
