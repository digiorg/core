apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 2: Platform Services - Grafana depends on Keycloak for OAuth
    argocd.argoproj.io/sync-wave: "2"
    platform.digiorg.io/upgrade-gate: "issue-275-manual"
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.17.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/platform/base/grafana/values.yaml
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: test/issue-279-runtime
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    # Major Prometheus Operator/CRD migration: promote and validate manually.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
