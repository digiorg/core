apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: "1.*"
      helm:
        releaseName: harbor
        valueFiles:
          - $values/platform/base/harbor/values.yaml
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: HEAD
      path: platform/base/harbor
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
