apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 0: Infrastructure operator — no dependencies on other platform services
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    # Issue #275 approved baseline (bumped from 0.22.0), revalidated against
    # https://cloudnative-pg.github.io/charts and Helm-rendered with these values.
    targetRevision: 0.29.0
    helm:
      releaseName: cnpg
      values: |
        # CloudNativePG Helm values for local development
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
