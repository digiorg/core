apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-providers
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 4: Depends on Crossplane (Wave 3) being installed and CRDs being available
    argocd.argoproj.io/sync-wave: "4"
    platform.digiorg.io/upgrade-gate: "issue-275-manual"
spec:
  project: default

  source:
    repoURL: https://github.com/digiorg/core.git
    targetRevision: e8ff0be6c74866f4e1045bc38d7c2efc88dadf26
    path: crossplane/providers/packages

  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system

  syncPolicy:
    # Manual until the Crossplane v2 provider packages report Healthy.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
