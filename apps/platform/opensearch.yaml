apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 0: core data layer, alongside legacy PostgreSQL (Issue #283).
    # OpenSearch is the trace/log backend for Jaeger and Fluentd and must be
    # functionally ready before either starts. The previous wave-3 placement
    # was justified by "ServiceMonitor CRD must exist first", but the
    # Prometheus Operator CRDs are installed in Phase 1 (before the root
    # Application even exists) and this Application's own Kustomize base
    # carries no ServiceMonitor (that lives in platform/base/monitoring-extras,
    # wave 5) — so that justification never applied to this Application's sync.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  sources:
    # OpenSearch via official Helm chart (GitHub Pages — https://helm.opensearch.org does not exist)
    - repoURL: https://opensearch-project.github.io/helm-charts
      chart: opensearch
      targetRevision: "3.7.0"
      helm:
        releaseName: opensearch
        valueFiles:
          - $values/platform/base/opensearch/values.yaml

    # Reference to values file in Git repo
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: main
      ref: values

    # ServiceMonitor and supplementary resources via Kustomize
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: main
      path: platform/base/opensearch

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-db

  # The chart omits immutable PVC-template type/default fields that Kubernetes
  # stores on the StatefulSet. Ignore only those API defaults and status.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: opensearch-cluster-master
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[]?.apiVersion'
        - '.spec.volumeClaimTemplates[]?.kind'
        - '.spec.volumeClaimTemplates[]?.spec.volumeMode'
        - '.spec.volumeClaimTemplates[]?.status'

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
