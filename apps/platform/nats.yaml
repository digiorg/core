apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 0: Deploy alongside cert-manager and postgresql
    # No Keycloak dependency — NATS must be ready before Wave 1
    argocd.argoproj.io/sync-wave: "0"
    platform.digiorg.io/upgrade-gate: "issue-275-manual"
spec:
  project: default

  sources:
    # NATS Server via Helm chart
    - repoURL: https://nats-io.github.io/k8s/helm/charts
      chart: nats
      targetRevision: "2.14.2"
      helm:
        releaseName: nats
        valueFiles:
          - $values/platform/base/nats/values.yaml

    # Reference to values file in Git repo
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: test/issue-281-runtime
      ref: values

    # Surveyor and its Service via Kustomize. The messaging Namespace is owned
    # centrally by the namespaces Application.
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: test/issue-281-runtime
      path: platform/base/nats

  destination:
    server: https://kubernetes.default.svc
    namespace: messaging

  # Kubernetes persists a status field inside each StatefulSet PVC template.
  # Argo CD 3.4.5 does not normalize that nested status, which otherwise leaves
  # the healthy NATS StatefulSet permanently OutOfSync after every successful
  # server-side apply. Ignore only this API-populated status field.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: nats
      namespace: messaging
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status

  syncPolicy:
    # Major chart migration with JetStream persistence: promote manually.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
