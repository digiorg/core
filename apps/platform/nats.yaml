apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    platform.digiorg.io/upgrade-gate: issue-275-manual
spec:
  project: default
  sources:
  - repoURL: https://nats-io.github.io/k8s/helm/charts
    chart: nats
    targetRevision: 2.14.2
    helm:
      releaseName: nats
      valueFiles:
      - $values/platform/base/nats/values.yaml
  - repoURL: https://github.com/digiorg/core.git
    targetRevision: issue285-runtime-v9-20260724T122821Z
    ref: values
  - repoURL: https://github.com/digiorg/core.git
    targetRevision: issue285-runtime-v9-20260724T122821Z
    path: platform/base/nats
  destination:
    server: https://kubernetes.default.svc
    namespace: messaging
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: nats
    namespace: messaging
    jqPathExpressions:
    - .spec.volumeClaimTemplates[]?.status
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
