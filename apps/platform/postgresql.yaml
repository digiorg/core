apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  source:
    repoURL: https://github.com/digiorg/core.git
    targetRevision: issue285-runtime-v9-20260724T122821Z
    path: platform/base/postgresql
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-db
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: postgresql
    jqPathExpressions:
    - .spec.volumeClaimTemplates[]?.status
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
