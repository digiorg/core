apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 1: the CNPG Cluster + database bootstrap. Must sync AFTER the CNPG
    # operator (apps/platform/cnpg.yaml, wave 0) so the postgresql.cnpg.io CRDs
    # exist. The consumer alias Service becomes authoritative only at cutover,
    # when the legacy `postgresql` Application is disabled — see
    # docs/guides/postgres-cnpg-migration.md.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/digiorg/core.git
    targetRevision: test/issue-281-runtime
    path: platform/base/cnpg

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-db

  syncPolicy:
    # Issue #281: script-driven, NOT automated. On a clean bootstrap an automated
    # sync applied Cluster/postgresql-cnpg before the CNPG operator's admission
    # webhook accepted connections (`connection refused`), and the failed
    # operation then stayed Running behind a Pending backup PVC so Argo's retry
    # never recovered. scripts/local-setup.nu (`promote_cnpg_cluster`) instead
    # waits for the operator Deployment to be Available and the webhook endpoint
    # to be ready, then syncs with a fresh operation. Shared/production clusters
    # follow docs/guides/postgres-cnpg-migration.md.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
