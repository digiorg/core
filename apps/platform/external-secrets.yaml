# =============================================================================
# External Secrets Operator ArgoCD Application
# Deploys ESO via official Helm chart with custom values
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 0: CRD operator — must be ready before any ExternalSecret resources
    argocd.argoproj.io/sync-wave: "0"
    platform.digiorg.io/upgrade-gate: "issue-275-manual"
spec:
  project: default

  sources:
    # Source 1: External Secrets Operator Helm chart
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: "2.7.0"
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/base/external-secrets/values.yaml

    # Source 2: Values from Git repository
    - repoURL: https://github.com/digiorg/core.git
      targetRevision: issue290-runtime-v14-20260730T104857Z
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    # ESO 0.x -> 2.x changes CRD storage/APIs. Promote manually after CR backup
    # and v1 conversion validation; restore automation in the promotion commit.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
