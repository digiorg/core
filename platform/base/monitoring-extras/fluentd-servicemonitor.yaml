apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluentd
  namespace: logging
  labels:
    release: prometheus    # Required: kube-prometheus-stack discovers by this label
spec:
  namespaceSelector:
    matchNames:
      - logging
  selector:
    matchLabels:
      app: fluentd
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
