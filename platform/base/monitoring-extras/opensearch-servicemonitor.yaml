apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opensearch
  namespace: platform-db
  labels:
    release: prometheus    # Required: kube-prometheus-stack discovers by this label
spec:
  namespaceSelector:
    matchNames:
      - platform-db
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch-metrics-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
