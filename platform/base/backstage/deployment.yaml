apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  # Allow more time for image pull + startup on slow connections
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      automountServiceAccountToken: false
      # Wait for PostgreSQL to be ready before starting Backstage
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z postgresql.platform-db.svc.cluster.local 5432; do
                echo "PostgreSQL not ready yet, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-oidc-discovery
          image: natsio/nats-box:0.19.2@sha256:8031d190c7ee24081f3f27cc939fb647a1eeb29ebb5c60fef9b5b6c7a846d6a2
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              DISCOVERY_URL="https://digiorg.local/keycloak/realms/digiorg-core-platform/.well-known/openid-configuration"
              EXPECTED_ISSUER="https://digiorg.local/keycloak/realms/digiorg-core-platform"
              CA_PATH="/etc/digiorg/ca/ca.crt"
              MAX_ATTEMPTS=60
              RETRY_DELAY_SECONDS=5

              attempt=1
              while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
                echo "Waiting for OIDC discovery (attempt $attempt/$MAX_ATTEMPTS)..."
                if discovery_document="$(
                  curl --disable --fail --silent --show-error \
                    --connect-timeout 3 --max-time 5 \
                    --cacert "$CA_PATH" "$DISCOVERY_URL" 2>/dev/null
                )" && printf '%s' "$discovery_document" | jq -e \
                  --arg expected_issuer "$EXPECTED_ISSUER" \
                  'type == "object" and .issuer == $expected_issuer' \
                  >/dev/null 2>&1; then
                  echo "OIDC discovery is ready."
                  exit 0
                fi

                if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                  sleep "$RETRY_DELAY_SECONDS"
                fi
                attempt=$((attempt + 1))
              done

              echo "ERROR: OIDC discovery did not become ready after 60 attempts." >&2
              exit 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: digiorg-local-ca
              mountPath: /etc/digiorg/ca
              readOnly: true
      containers:
        - name: backstage
          image: ghcr.io/digiorg/core-portal:a21f3e7@sha256:57312d346e27e87d72d17ebcf478827bb24d1c0a45ce9a49f5aa63fddcbb5593
          imagePullPolicy: Always
          ports:
            - containerPort: 7007
          env:
            # Application URLs
            - name: APP_BASE_URL
              value: "https://digiorg.local/backstage"
            - name: BACKEND_BASE_URL
              value: "https://digiorg.local/backstage"
            
            # PostgreSQL connection (using shared PostgreSQL in platform-db namespace)
            - name: POSTGRES_HOST
              value: postgresql.platform-db.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: POSTGRES_PASSWORD
            
            # Session secret for OIDC auth
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: AUTH_SESSION_SECRET
            
            # Keycloak OIDC configuration
            - name: AUTH_OIDC_METADATA_URL
              value: "https://digiorg.local/keycloak/realms/digiorg-core-platform/.well-known/openid-configuration"
            # Issue #285 (TLS hardening): trust the digiorg.local CA via a
            # mounted copy of the public certificate (see the
            # digiorg-local-ca volume below), never
            # NODE_TLS_REJECT_UNAUTHORIZED=0 -- that disables certificate
            # verification for every outbound HTTPS call this process makes
            # (Keycloak OIDC discovery, the Gitea integration), not just one.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/digiorg/ca/ca.crt
            - name: AUTH_OIDC_CLIENT_ID
              value: backstage
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: AUTH_OIDC_CLIENT_SECRET
            
            # GitHub integration (optional)
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GITHUB_TOKEN
                  optional: true
            # Gitea integration (Issue #285): required for the AppClaim
            # GitOps create-pull-request publish action. Dedicated
            # least-privilege identity (write access to DigiOrg/app-config
            # only), provisioned by scripts/local-setup.nu
            # configure_backstage_gitea_publisher -- never the platform
            # bootstrap/admin token. Fail-closed (not optional): publishing
            # must never silently no-op with an empty credential.
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-gitea-credentials
                  key: GITEA_TOKEN
                  optional: false
            # Kubernetes Ingestor — in-cluster configuration
            # KUBERNETES_API_URL: internal cluster API server (Backstage runs in-cluster)
            - name: KUBERNETES_API_URL
              value: "https://kubernetes.default.svc"
            # Token from long-lived ServiceAccount secret (created by local-setup.nu).
            # Required because automountServiceAccountToken is disabled above:
            # Backstage must not start without Kubernetes ingestion credentials.
            - name: KUBERNETES_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-token
                  key: token
                  optional: false
          volumeMounts:
            # Public certificate only (never cert-manager's private key) --
            # kept in sync by scripts/local-setup.nu
            # copy_digiorg_local_ca_to_namespace.
            - name: digiorg-local-ca
              mountPath: /etc/digiorg/ca
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: 7007
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: digiorg-local-ca
          secret:
            secretName: digiorg-local-ca
            items:
              - key: ca.crt
                path: ca.crt
                mode: 0444
