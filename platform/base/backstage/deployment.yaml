apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  # Allow more time for image pull + startup on slow connections
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      # Wait for PostgreSQL to be ready before starting Backstage
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z postgresql.platform-db.svc.cluster.local 5432; do
                echo "PostgreSQL not ready yet, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: backstage
          image: ghcr.io/digiorg/core-portal:b77e94a@sha256:44d00aba125e1e66d712222ec7f64cbc7cce02f05e5f05146af5af996bfe19dd
          imagePullPolicy: Always
          ports:
            - containerPort: 7007
          env:
            # Application URLs
            - name: APP_BASE_URL
              value: "https://digiorg.local/backstage"
            - name: BACKEND_BASE_URL
              value: "https://digiorg.local/backstage"
            
            # PostgreSQL connection (using shared PostgreSQL in platform-db namespace)
            - name: POSTGRES_HOST
              value: postgresql.platform-db.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: POSTGRES_PASSWORD
            
            # Session secret for OIDC auth
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: AUTH_SESSION_SECRET
            
            # Keycloak OIDC configuration
            - name: AUTH_OIDC_METADATA_URL
              value: "https://digiorg.local/keycloak/realms/digiorg-core-platform/.well-known/openid-configuration"
            # Skip TLS verification for self-signed cert in local dev
            # Remove NODE_TLS_REJECT_UNAUTHORIZED in production (use proper CA trust instead)
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: AUTH_OIDC_CLIENT_ID
              value: backstage
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: AUTH_OIDC_CLIENT_SECRET
            
            # GitHub integration (optional)
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: GITHUB_TOKEN
                  optional: true
            # Kubernetes Ingestor — in-cluster configuration
            # KUBERNETES_API_URL: internal cluster API server (Backstage runs in-cluster)
            - name: KUBERNETES_API_URL
              value: "https://kubernetes.default.svc"
            # Token from long-lived ServiceAccount secret (created by local-setup.nu)
            - name: KUBERNETES_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-token
                  key: token
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: 7007
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
