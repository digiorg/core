expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80
      httpsPort: 443

# Docker CLI uses this as the registry hostname
# externalURL must be the root domain (not a subpath) — Harbor requirement
externalURL: https://digiorg.local

existingSecretAdminPassword: harbor-admin-secret
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secret-key

# External PostgreSQL — reuse platform shared instance (platform-db namespace)
# Harbor's built-in PostgreSQL disabled to reduce resource usage
database:
  type: external
  external:
    host: postgresql.platform-db.svc.cluster.local
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-db-secret
    sslmode: disable

# Built-in Redis — no shared Redis in the platform
redis:
  type: internal

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      size: 10Gi
      accessMode: ReadWriteOnce
    jobservice:
      jobLog:
        size: 1Gi
    trivy:
      size: 5Gi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

trace:
  enabled: true
  provider: otel
  sample_rate: 0.1
  otel:
    endpoint: jaeger-collector.tracing.svc.cluster.local:4318
    url_path: /v1/traces
    compression: false
    insecure: true
    timeout: 10

trivy:
  enabled: true

cache:
  enabled: true
  expireHours: 24

logLevel: info

# OIDC SSO via Keycloak
# AUTH_MODE env vars are read by Harbor core on startup and written to the DB on first run.
# On a fresh Kind cluster (DB always empty), these are applied on every deployment.
# Harbor helm chart supports this via core.extraEnvVars (confirmed in templates/core/core-dpl.yaml).
core:
  extraEnvVars:
    - name: AUTH_MODE
      value: "oidc_auth"
    - name: OIDC_NAME
      value: "Keycloak"
    - name: OIDC_ENDPOINT
      value: "https://digiorg.local/keycloak/realms/digiorg-core-platform"
    - name: OIDC_CLIENT_ID
      value: "harbor"
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: harbor-oidc-secret
          key: OIDC_CLIENT_SECRET
    - name: OIDC_SCOPE
      value: "openid,profile,email,groups"
    - name: OIDC_VERIFY_CERT
      value: "false"
    - name: OIDC_AUTO_ONBOARD
      value: "true"
    - name: OIDC_USER_CLAIM
      value: "preferred_username"
    - name: OIDC_GROUPS_CLAIM
      value: "groups"
