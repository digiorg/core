expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80
      httpsPort: 443

# Docker CLI uses this as the registry hostname
# externalURL must be the root domain (not a subpath) — Harbor requirement
externalURL: https://digiorg.local

existingSecretAdminPassword: harbor-admin-secret
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secret-key
caBundleSecretName: digiorg-local-ca

# Chart 1.19.1 omits `quay` from Harbor's proxy-cache provider allowlist even
# though Harbor 2.15 supports it. An explicit container env value overrides the
# generated ConfigMap value and keeps every provider used by the GitOps hook.
core:
  extraEnvVars:
    - name: PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE
      value: "docker-hub,harbor,azure-acr,ali-acr,aws-ecr,google-gcr,quay,docker-registry,github-ghcr,jfrog-artifactory"

# External PostgreSQL — reuse platform shared instance (platform-db namespace)
# Harbor's built-in PostgreSQL disabled to reduce resource usage
database:
  type: external
  external:
    host: postgresql.platform-db.svc.cluster.local
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-db-secret
    sslmode: disable

# Built-in Redis — no shared Redis in the platform
redis:
  type: internal

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      size: 10Gi
      accessMode: ReadWriteOnce
    jobservice:
      jobLog:
        size: 1Gi
    trivy:
      size: 5Gi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    # Harbor chart 1.19 emits `release: harbor` itself. Do not add another
    # release key here; duplicate YAML keys make the rendered ServiceMonitor
    # invalid. Prometheus accepts both labels via its selector below.
    additionalLabels: {}

trace:
  enabled: true
  provider: otel
  sample_rate: 0.1
  otel:
    endpoint: jaeger-collector.tracing.svc.cluster.local:4318
    url_path: /v1/traces
    compression: false
    insecure: true
    timeout: 10

trivy:
  enabled: true

cache:
  enabled: true
  expireHours: 24

logLevel: info
