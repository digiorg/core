# Prometheus Stack Helm Values
# Chart: prometheus-community/kube-prometheus-stack
# Compatible with local-setup.nu

grafana:
  # Disable secret leak assertion for local dev (we use hardcoded secrets intentionally)
  assertNoLeakedSecrets: false
  
  service:
    type: ClusterIP  # Accessed via Ingress, not NodePort

  # Grafana served under /grafana path
  grafana.ini:
    server:
      root_url: "https://digiorg.local/grafana"
      serve_from_sub_path: true

    plugins:
      # Grafana 13.1.0 ships a compatible bundled Elasticsearch plugin. Keep
      # the background updater from replacing its read-only bundled files.
      preinstall_auto_update: false

    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      # For local dev only — in production use envValueFrom with a Secret reference
      client_secret: grafana-client-secret
      scopes: openid email profile roles
      auth_url: https://digiorg.local/keycloak/realms/digiorg-core-platform/protocol/openid-connect/auth
      token_url: https://digiorg.local/keycloak/realms/digiorg-core-platform/protocol/openid-connect/token
      api_url: https://digiorg.local/keycloak/realms/digiorg-core-platform/protocol/openid-connect/userinfo
      role_attribute_path: "contains(realm_access.roles[*], 'platform-admin') && 'Admin' || 'Viewer'"
      # Skip TLS verification for self-signed cert in local dev
      # Remove in production (use proper CA trust instead)
      tls_skip_verify_insecure: true

  sidecar:
    dashboards:
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
        folder: ""
        folderUid: ""
        disableDelete: false
        allowUiUpdates: false

  additionalDataSources:
    - name: Jaeger
      type: jaeger
      url: http://jaeger-query.tracing.svc.cluster.local:16686/jaeger
      access: proxy
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: prometheus

    # OpenSearch as Elasticsearch-compatible datasource for direct trace/log search.
    # Uses the jaeger-span-* index pattern written by Jaeger.
    - name: OpenSearch (Traces)
      type: elasticsearch
      url: http://opensearch-cluster-master.platform-db.svc.cluster.local:9200
      access: proxy
      isDefault: false
      jsonData:
        esVersion: "70"          # OpenSearch is compatible with ES 7.10.2 API
        timeField: startTimeMillis
        logMessageField: operationName
        logLevelField: tags.level
      # Index pattern: jaeger-span-YYYY-MM-DD (daily rotation by Jaeger)
      database: "jaeger-span-*"

    # OpenSearch as Elasticsearch-compatible datasource for application and platform logs.
    # Uses the digiorg-logs-* index pattern written by Fluentd.
    - name: OpenSearch (Logs)
      type: elasticsearch
      url: http://opensearch-cluster-master.platform-db.svc.cluster.local:9200
      access: proxy
      isDefault: false
      jsonData:
        esVersion: "70"          # OpenSearch is compatible with ES 7.10.2 API
        timeField: "@timestamp"
        logMessageField: log
        logLevelField: level
      database: "digiorg-logs-*"

prometheus:
  prometheusSpec:
    retention: 1d
    # Allow Prometheus to discover ServiceMonitors across all namespaces
    # (default: only monitoring namespace). Required for NATS Surveyor in messaging ns.
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector:
      matchExpressions:
        - key: release
          operator: In
          values:
            - prometheus
            - harbor

# Issue 375 / approved S1: narrowly bounded read-only app inventory.
kube-state-metrics:
  metricLabelsAllowlist:
    - namespaces=[platform.digiorg.io/type,platform.digiorg.io/app-id,platform.digiorg.io/team]
  rbac:
    extraRules:
      - apiGroups: [platform.digiorg.io]
        resources: [appclaims]
        verbs: [get, list, watch]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: platform.digiorg.io
              version: v1alpha1
              kind: AppClaim
            metricNamePrefix: digiorg_app
            labelsFromPath:
              app_id: [spec, appName]
              namespace: [spec, appName]
              claim: [metadata, name]
              claim_namespace: [metadata, namespace]
              claim_uid: [metadata, uid]
            metrics:
              - name: info
                help: Registered AppClaim identity; not workload health or Grafana import readiness.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      team: [spec, team]
              - name: service_info
                help: Expected service before its Deployment exists.
                each:
                  type: Info
                  info:
                    path: [spec, services]
                    labelsFromPath:
                      service: [name]
              - name: condition
                help: Actual claim condition; absent conditions remain unknown.
                each:
                  type: StateSet
                  stateSet:
                    path: [status, conditions]
                    labelsFromPath:
                      condition: [type]
                    labelName: status
                    valueFrom: [status]
                    list: ["True", "False", "Unknown"]

alertmanager:
  enabled: false
