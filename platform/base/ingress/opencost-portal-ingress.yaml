# =============================================================================
# OpenCost Portal Ingress
#
# Routes /opencost (and everything beneath it) → oauth2-proxy → opencost UI
# (port 9090). The custom v1.120.4 UI image is built with vite_basename=/opencost
# and serves the SPA, static assets and the /opencost/model API natively under
# the subpath, so there is NO path rewrite here (the /opencost prefix must reach
# the UI intact) and NO separate asset Ingress. Every /opencost request — assets
# included — therefore stays behind the oauth2-proxy (no unauthenticated bypass).
#
# Boot: applied by local-setup.nu bootstrap (not managed by ArgoCD).
# Issue: #229 #231 #233 #272
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencost-portal-ingress
  namespace: ingress-nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - digiorg.local
      secretName: digiorg-local-tls
  rules:
    - host: digiorg.local
      http:
        paths:
          - path: /opencost(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: opencost-oauth2-proxy
                port:
                  number: 4180
