apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # cert-manager upstream manifest (v1.20.1) — Issue #275 routine update
  - https://github.com/cert-manager/cert-manager/releases/download/v1.20.1/cert-manager.yaml
  # Issuers and certificates (applied after cert-manager CRDs are ready)
  - cluster-issuers.yaml
  - certificate-dev.yaml

# The upstream bundle includes Namespace/cert-manager, but namespace ownership is
# centralized in platform/base/namespaces. Remove the duplicate resource.
patches:
  - target:
      version: v1
      kind: Namespace
      name: cert-manager
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager
      $patch: delete
