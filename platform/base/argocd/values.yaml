# ArgoCD Helm Values
# Chart: argo/argo-cd
# Compatible with local-setup.nu (NodePort overrides applied by that script)

global:
  image:
    tag: ""  # defaults to chart appVersion

# -- ArgoCD Secret configuration (OIDC client secret for Keycloak)
configs:
  secret:
    # OIDC client secret - key must match provider name in oidc.config
    # Format: oidc.<provider-name>.clientSecret where provider-name is lowercase
    extra:
      oidc.keycloak.clientSecret: argocd-client-secret

# -- ArgoCD ConfigMap and parameter configuration
  # argocd-cm ConfigMap
  cm:
    # Disable admin user - use Keycloak SSO instead
    admin.enabled: "false"
    
    # Track resources via annotations instead of labels (avoids label conflicts)
    application.resourceTrackingMethod: annotation

    # Reconciliation timeout
    timeout.reconciliation: 60s

    # Custom health check for Crossplane Provider resources
    # Fixes: "cannot perform concat operation between string and nil" (issue #175)
    # The built-in Lua script fails when condition.message is nil during provider initialization.
    resource.customizations.health.pkg.crossplane.io_Provider: |
      hs = {}
      if obj.status == nil or obj.status.conditions == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for provider to initialize"
        return hs
      end
      for i, condition in ipairs(obj.status.conditions) do
        if condition.type == "Healthy" then
          if condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message or "Provider is healthy"
            return hs
          else
            hs.status = "Progressing"
            hs.message = condition.message or "Provider is not yet healthy"
            return hs
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for Healthy condition"
      return hs

    # Prometheus Operator creates the StatefulSet asynchronously after the CR.
    # During the proven clean-bootstrap race, only this exact initial condition
    # is Progressing. Every other negative, mixed, or stale condition remains
    # fail-closed so real reconciliation failures cannot be hidden.
    resource.customizations.health.monitoring.coreos.com_Prometheus: |
      hs = {}
      if obj.status == nil or obj.status.conditions == nil or #obj.status.conditions == 0 then
        hs.status = "Progressing"
        hs.message = "Waiting for Prometheus Operator status"
        return hs
      end

      local generation = obj.metadata and obj.metadata.generation
      local exactStatefulSetStartup = false
      local available = false

      for i, condition in ipairs(obj.status.conditions) do
        if generation == nil or condition.observedGeneration == nil or condition.observedGeneration ~= generation then
          hs.status = "Degraded"
          hs.message = "Prometheus condition generation is stale or missing"
          return hs
        end

        if condition.status == "True" then
          if condition.type == "Available" then
            available = true
          end
        else
          local isExactStatefulSetStartup =
            obj.metadata.name == "prometheus-kube-prometheus-prometheus" and
            obj.metadata.namespace == "monitoring" and
            condition.type == "Available" and
            condition.status == "False" and
            condition.reason == "StatefulSetNotFound" and
            condition.message == "shard 0: statefulset monitoring/prometheus-prometheus-kube-prometheus-prometheus not found"

          if isExactStatefulSetStartup and not exactStatefulSetStartup then
            exactStatefulSetStartup = true
          else
            hs.status = "Degraded"
            hs.message = condition.message or "Prometheus reports a negative condition"
            return hs
          end
        end
      end

      if exactStatefulSetStartup then
        if available then
          hs.status = "Degraded"
          hs.message = "Prometheus reports contradictory Available conditions"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the operator-generated StatefulSet"
        return hs
      end

      if available then
        hs.status = "Healthy"
        hs.message = "Prometheus is available for the current generation"
        return hs
      end

      hs.status = "Degraded"
      hs.message = "Prometheus has no current Available=True condition"
      return hs

    # SSO/OIDC via Keycloak (digiorg-core-platform realm)
    # Using digiorg.local with path-based routing (standard port 80)
    # Requires /etc/hosts: 127.0.0.1 digiorg.local
    url: https://digiorg.local/argocd
    oidc.config: |
      name: Keycloak
      issuer: https://digiorg.local/keycloak/realms/digiorg-core-platform
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - roles
      # rootCA: injected by local-setup.nu after cert-manager provisions the CA
      # The setup script patches this ConfigMap with the actual CA cert.
      # In production (Let's Encrypt), remove rootCA entirely.

  # argocd-cmd-params-cm ConfigMap
  params:
    # Disable TLS at the ArgoCD server — TLS is terminated at the ingress/load balancer
    server.insecure: "true"

    # Base path for ArgoCD (path-based routing via Ingress)
    server.basehref: "/argocd"
    server.rootpath: "/argocd"

    # Issue #293: preserved OOM evidence identified an Application Controller
    # process above the former 1 GiB limit during the clean-bootstrap window.
    # Reduce the default 20 status / 10 operation worker fan-out to bound local
    # reconciliation concurrency; runtime sufficiency still requires replay.
    controller.status.processors: "10"
    controller.operation.processors: "5"

    # ApplicationSet controller log level
    applicationsetcontroller.log.level: info

  # argocd-rbac-cm ConfigMap (least-privilege defaults)
  rbac:
    # Default role for authenticated users without explicit group membership
    policy.default: role:readonly

    # RBAC policy rules (CSV format)
    policy.csv: |
      # Admin role — full access to all resources
      p, role:admin, applications, *, */*, allow
      p, role:admin, applicationsets, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, projects, *, *, allow
      p, role:admin, accounts, *, *, allow
      p, role:admin, certificates, *, *, allow
      p, role:admin, gpgkeys, *, *, allow
      p, role:admin, logs, get, */*, allow
      p, role:admin, exec, create, */*, allow

      # Read-only role — view access only
      p, role:readonly, applications, get, */*, allow
      p, role:readonly, applications, sync, */*, deny
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, repositories, get, *, allow
      p, role:readonly, projects, get, *, allow
      p, role:readonly, logs, get, */*, allow

      # Group bindings (adjust group names to match your IdP)
      g, platform-admins, role:admin
      g, platform-viewers, role:readonly

    # OIDC scopes to inspect for group membership
    scopes: "[groups, email]"

# -- ArgoCD server configuration
server:
  service:
    # NodePort for local KinD development
    # Production: change to ClusterIP and use an Ingress
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443

  ingress:
    enabled: false
    # Production example (enable and configure when not using NodePort):
    # enabled: true
    # ingressClassName: nginx
    # hostname: argocd.example.com
    # tls: true
    # annotations:
    #   cert-manager.io/cluster-issuer: letsencrypt-prod

  # Resource limits for the server
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Application controller
# Issue #293: a preserved kernel OOM sample reports approximately 1,105 MiB of
# summed anonymous and file-backed resident memory for an Argo controller
# process. Select a bounded 1,280 MiB candidate ceiling (about 175 MiB above
# that sample) together with reduced fan-out. Runtime validation is required;
# do not expand unrelated components or shift to a broad 2 GiB allocation.
controller:
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1280Mi

# -- ApplicationSet controller
applicationSet:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Repo server
# Issue #279: the app-of-apps root Application triggers many concurrent
# Git/Helm/Kustomize comparisons at once. Under the original 50m/64Mi request
# (500m/256Mi limit) with the chart's default 1s probe timeout, repo-server
# missed its /healthz?full=true liveness deadline during that initial burst,
# kubelet restarted it mid-render, and the severed gRPC stream surfaced as
# `ComparisonError ... rpc error: code = Unavailable desc = error reading from
# server: EOF` on whichever Application was rendering at that moment
# (confirmed on both Windows and Linux KinD). Raised requests/limits and probe
# timeouts so repo-server survives the initial render burst instead of
# flapping.
repoServer:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5

# -- Redis
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- Notifications controller (optional)
notifications:
  enabled: false
  # To enable: set enabled: true and configure triggers/templates below
  # resources:
  #   requests:
  #     cpu: 50m
  #     memory: 64Mi
  #   limits:
  #     cpu: 200m
  #     memory: 128Mi
