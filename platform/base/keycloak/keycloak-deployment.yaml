# =============================================================================
# Keycloak Deployment — DigiOrg production-optimized image (Issue #275, Tier 1)
# Built by platform/images/keycloak/build.nu from the digest-pinned upstream
# base quay.io/keycloak/keycloak:26.7.0 with `kc.sh build` (db=postgres, health,
# metrics), then started with `start --optimized`. HTTP enabled for local dev;
# realm data stays in the mounted keycloak-realm-import configMap (not baked in).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          # Locally built + kind-loaded DigiOrg optimized image (never pulled).
          image: digiorg/keycloak:26.7.0-optimized
          imagePullPolicy: Never
          args:
            # Production start against the pre-built optimized distribution.
            - start
            - --optimized
            # Realm data stays in the mounted configMap volume (imported at boot).
            - --import-realm
          env:
            # Database
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgresql.platform-db.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
            # Admin bootstrap (dev only)
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            # HTTP / hostname configuration
            # Hostname v2 (Keycloak 26+): KC_HOSTNAME accepts full URL including path
            # Requires /etc/hosts entry: 127.0.0.1 digiorg.local
            - name: KC_HOSTNAME
              value: "https://digiorg.local/keycloak"
            - name: KC_HOSTNAME_ADMIN
              value: "https://digiorg.local/keycloak"
            # KC_HTTP_RELATIVE_PATH tells Keycloak to serve content under /keycloak path
            # This is required in addition to KC_HOSTNAME_URL for proper routing
            - name: KC_HTTP_RELATIVE_PATH
              value: "/keycloak"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # Health endpoint for probes (on separate management port 9000)
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Management interface must use root path, not the HTTP relative path
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: "/"
            # JVM heap ceiling — must stay below container memory limit (2Gi)
            # Without this, JVM estimates available RAM from host instead of container limits → OOMKill
            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50 -XX:MaxRAM=1536m"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: health
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30  # 30 * 10s = 5 minutes max startup time
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
