apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CNPG Cluster — OPTIONAL future hosted-application database infrastructure
# (Issue #283). The CNPG *operator* is installed via Helm by the `cnpg` ArgoCD
# Application (apps/platform/cnpg.yaml); this base is deployed by the
# `cnpg-cluster` Application (apps/platform/cnpg-cluster.yaml). Neither is on
# the internal platform's dependency path: Keycloak, Backstage, Gitea,
# SonarQube and Harbor permanently use the legacy PostgreSQL StatefulSet
# (platform/base/postgresql). See docs/guides/cnpg-future-app-database.md.
#
# Secrets: CNPG owns and auto-generates its own Secrets (e.g. the `app`
# bootstrap database's `postgresql-cnpg-app` credentials). Nothing here is
# coupled to postgresql-secrets or any other legacy-platform credential.

namespace: platform-db

resources:
  - cluster.yaml
