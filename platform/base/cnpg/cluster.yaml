# =============================================================================
# CloudNativePG Cluster — future hosted-application PostgreSQL (Issue #283)
# =============================================================================
# CNPG is OPTIONAL, future database infrastructure for applications that will
# be hosted ON the platform later. It is NOT a migration or replacement target
# for the internal platform components' database: Keycloak, Backstage, Gitea,
# SonarQube and Harbor permanently use the legacy PostgreSQL StatefulSet
# (platform/base/postgresql) at postgresql.platform-db.svc.cluster.local. See
# docs/guides/cnpg-future-app-database.md.
#
# This Cluster uses only CNPG-owned, auto-generated Secrets — CNPG creates its
# own `postgresql-cnpg-app` credentials Secret for the `app` bootstrap
# database. It must never be coupled to any legacy-platform credential, and it
# hosts none of the internal platform's databases or users.
#
# Because nothing on the core platform's critical path depends on CNPG, both
# ArgoCD Applications (apps/platform/cnpg.yaml, apps/platform/cnpg-cluster.yaml)
# are manual. Core bootstrap creates only their Application CRs; the explicit,
# fail-closed `nu scripts/local-setup.nu future-infra` command promotes the
# operator first and this Cluster second.
# =============================================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-cnpg
  namespace: platform-db
  labels:
    app.kubernetes.io/name: postgresql-cnpg
    app.kubernetes.io/part-of: digiorg-platform
spec:
  instances: 1

  # PG16, digest-pinned. Pin revalidated per scripts/check_pins.py.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9@sha256:cca50a94e2da46ddcaefb23260c805ed3b466763bd2a25e1617410176d5fd0ab

  # Modest footprint: this Cluster does not yet host any real workload.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  storage:
    size: 1Gi

  postgresql:
    parameters:
      max_connections: "100"

  bootstrap:
    initdb:
      database: app
      owner: app
      # CNPG auto-generates and owns the `postgresql-cnpg-app` credentials
      # Secret for this bootstrap database. Nothing here references any
      # legacy-platform Secret, database or user.

  # No barmanObjectStore/backup configuration: this Cluster hosts no
  # application yet, so there is nothing to back up. Add a real backup
  # configuration when an application is actually provisioned onto it.
