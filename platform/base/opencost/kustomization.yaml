apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oauth2-proxy.yaml
  - servicemonitor.yaml
  # NOTE: the custom v1.120.4 UI image (ui-image/) serves /opencost natively, so
  # the old ui-proxy (HTML sub_filter) has been removed (Issue #272 Option B).
  # NOTE: the opencost-portal-ingress is in platform/base/ingress/ and applied
