# =============================================================================
# OpenCost UI Proxy
#
# Lightweight nginx reverse proxy that rewrites the OpenCost SPA HTML
# responses at the application level, avoiding the NGINX Ingress Controller's
# configuration-snippet restriction (snippet annotations are disabled for
# security reasons on this cluster).
#
# Responsibilities:
#   1. Strip the /opencost prefix when forwarding to opencost:9090
#      (standard nginx proxy_pass with trailing / on location and upstream)
#   2. Apply sub_filter to HTML responses, covering BOTH UI build layouts:
#        Parcel v2 (root-level chunks):
#          src="/index.    →  src="/opencost/index.
#          href="/index.   →  href="/opencost/index.
#          href="/favicon. →  href="/opencost/favicon.
#        Vite (/assets/* chunks):
#          src="/assets/   →  src="/opencost/assets/
#          href="/assets/  →  href="/opencost/assets/
#      The currently deployed OpenCost UI is a Parcel v2 build that emits
#      root-level chunks (e.g. /index.6dd063c6.js, /index.runtime.216fe643.js,
#      /index.3406705b.css), while newer OpenCost UI releases ship a Vite build
#      that emits /assets/*. Without these rewrites the browser requests those
#      chunks at the domain root (https://digiorg.local/index.* or /assets/*)
#      and gets 404s — a white /opencost page. nginx 1.27 supports multiple
#      sub_filter directives at one level (they are NOT duplicate keys — each is
#      a distinct search string), so both layouts' rules coexist in every block.
#   3. Disable upstream gzip so sub_filter can operate on uncompressed HTML
#      (Accept-Encoding "" is sent upstream, so the response body is never
#      gzip-encoded and the ngx_http_gunzip_module is not required here).
#
# The oauth2-proxy --upstream points to this service (port 9091).
# Static assets (/opencost/index.*, /opencost/assets/* and favicon) bypass
# this proxy entirely and are served directly by opencost:9090 via the
# opencost-assets-ingress (rewrite-target: /$1 strips the /opencost prefix
# at the NGINX ingress level).
#
# Issue: #233 #266 #268 #272
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencost-ui-proxy-config
  namespace: cost-monitoring
  labels:
    app.kubernetes.io/name: opencost-ui-proxy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: digiorg-core-platform
data:
  nginx.conf: |
    worker_processes  1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 64;
    }

    http {
      # No mime.types include needed for a pure reverse-proxy:
      # Content-Type is determined by upstream response headers, not nginx.
      # Including mime.types caused a duplicate 'text/html' warning on nginx:alpine.
      default_type  application/octet-stream;
      access_log    /dev/stdout;

      # Required temp dirs for non-root nginx
      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;

      server {
        listen 9091;
        server_name _;

        # Proxy to OpenCost UI: strip /opencost prefix + rewrite HTML asset paths.
        # proxy_pass with trailing / on both location and upstream strips the prefix:
        #   GET /opencost/      → GET /      at opencost:9090
        #   GET /opencost/foo   → GET /foo   at opencost:9090
        # Health endpoint: checks nginx is alive WITHOUT touching the upstream.
        # Used by liveness + readiness probes so a slow-starting opencost pod
        # (1-3 min for Prometheus init) does not cause CrashLoopBackOff.
        location /healthz {
          access_log off;
          return 200 "ok";
          add_header Content-Type text/plain;
        }

        # Exact match for the bare /opencost path (no trailing slash).
        # Without this, nginx auto-redirects /opencost → /opencost/ using an
        # absolute Location that includes the internal port 9091 (non-standard,
        # so nginx appends it). oauth2-proxy forwards that Location as-is, leaking
        # http://digiorg.local:9091/opencost/ to the browser which can't reach it.
        # This block proxies the root directly — no redirect, no port leak.
        # Issue: #241
        location = /opencost {
          proxy_pass         http://opencost.cost-monitoring.svc.cluster.local:9090/;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_set_header   Accept-Encoding   "";
          proxy_redirect http://opencost.cost-monitoring.svc.cluster.local:9090/
                         https://digiorg.local/opencost/;
          # Rewrite root-absolute SPA asset paths for BOTH build layouts.
          # nginx 1.27 applies every sub_filter directive at this level in a
          # single pass, so the Parcel (/index.*, /favicon.*) and Vite
          # (/assets/*) rules coexist without conflict.
          sub_filter_once off;
          sub_filter_types  text/html;
          sub_filter 'src="/index.'    'src="/opencost/index.';
          sub_filter 'href="/index.'   'href="/opencost/index.';
          sub_filter 'href="/favicon.' 'href="/opencost/favicon.';
          sub_filter 'src="/assets/'   'src="/opencost/assets/';
          sub_filter 'href="/assets/'  'href="/opencost/assets/';
        }

        location /opencost/ {
          proxy_pass         http://opencost.cost-monitoring.svc.cluster.local:9090/;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Real-IP         $remote_addr;
          proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;

          # Disable upstream compression so sub_filter can work on plain HTML
          proxy_set_header   Accept-Encoding   "";

          # Rewrite upstream-absolute Location headers to the public HTTPS URL.
          # An explicit proxy_redirect rule implicitly disables the nginx default
          # rewriting (which would leak the internal port 9091). Do NOT combine
          # with 'proxy_redirect off;' — that causes a duplicate-directive crash.
          proxy_redirect http://opencost.cost-monitoring.svc.cluster.local:9090/
                         https://digiorg.local/opencost/;

          # Rewrite root-absolute SPA asset paths to the /opencost/ prefix.
          # OpenCost UI compiles with base '/', so both known build layouts
          # emit root-level references that must be prefixed:
          #   * Parcel v2 — /index.*.js, /index.runtime.*.js, /index.*.css,
          #                 /favicon.*
          #   * Vite      — /assets/*.js, /assets/*.css
          # nginx 1.27 supports multiple sub_filter directives at one level and
          # applies them in a single pass, so keeping both layouts' rules here
          # is robust across a UI toolchain switch. nginx does not recursively
          # re-scan a sub_filter's replacement output, so an already-rewritten
          # /opencost/index. or /opencost/assets/ reference cannot be prefixed a
          # second time.
          sub_filter_once off;
          sub_filter_types  text/html;
          sub_filter 'src="/index.'    'src="/opencost/index.';
          sub_filter 'href="/index.'   'href="/opencost/index.';
          sub_filter 'href="/favicon.' 'href="/opencost/favicon.';
          sub_filter 'src="/assets/'   'src="/opencost/assets/';
          sub_filter 'href="/assets/'  'href="/opencost/assets/';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost-ui-proxy
  namespace: cost-monitoring
  labels:
    app.kubernetes.io/name: opencost-ui-proxy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: digiorg-core-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencost-ui-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencost-ui-proxy
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              # /healthz returns 200 from nginx itself — no upstream dependency.
              # Avoids CrashLoopBackOff while opencost is still starting up.
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
      volumes:
        - name: nginx-config
          configMap:
            name: opencost-ui-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencost-ui-proxy
  namespace: cost-monitoring
  labels:
    app.kubernetes.io/name: opencost-ui-proxy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: digiorg-core-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opencost-ui-proxy
  ports:
    - name: http
      port: 9091
      targetPort: http
      protocol: TCP
