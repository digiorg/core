# =========================================================
# OpenCost — Helm Values
# Chart: https://github.com/opencost/opencost-helm-chart
# Issue: #224
# =========================================================

clusterName: digiorg-core-dev

opencost:
  # -- Prometheus configuration (chart resolves PROMETHEUS_SERVER_ENDPOINT from here;
  #    do NOT also set it in exporter.extraEnv — that causes a duplicate env var error)
  prometheus:
    # Use external URL with explicit cluster.local suffix — the Helm chart builds the
    # internal URL as svc.<clusterName>, which resolves to svc.digiorg-core-dev (invalid DNS).
    internal:
      enabled: false
    external:
      enabled: true
      url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"

  exporter:
    defaultClusterId: digiorg-core-dev
    apiPort: 9003
    resources:
      requests:
        cpu: 10m
        memory: 55Mi
      limits:
        memory: 512Mi

  customPricing:
    enabled: true
    provider: custom
    costModel:
      description: DigiOrg local dev pricing
      CPU: 0.031611
      spotCPU: 0.006655
      RAM: 0.004237
      spotRAM: 0.000892
      storage: 0.00005479452
      zoneNetworkEgress: 0.01
      regionNetworkEgress: 0.01
      internetNetworkEgress: 0.12

  mcp:
    enabled: true
    port: 8081

  ui:
    enabled: true
    # Chart 2.x exposes uiPath as a first-class value (Issue #275). Pin it to the
    # platform subpath so the serving path is set through the supported chart
    # value in addition to the UI_PATH env below.
    uiPath: /opencost
    # -- Custom subpath-aware UI image (Issue #272 Option B).
    #    Built from upstream v1.120.4 with `--build-arg vite_basename=/opencost`
    #    so the router basename, Vite asset base and nginx UI_PATH are all
    #    /opencost. Source of truth: platform/base/opencost/ui-image/build.nu
    #    (kept in sync with the tag below). The stock ghcr.io opencost-ui:1.113.0
    #    router is rooted at "/" and renders a blank page under /opencost.
    image:
      registry: digiorg
      repository: opencost-ui
      tag: "v1.120.4-basename-opencost"
      # kind-loaded local image — must not force a registry pull.
      pullPolicy: IfNotPresent
    extraEnv:
      # BASE_URL renders the nginx model-proxy location at runtime. The standard
      # v1.120.4 JavaScript client gets the matching /opencost/model API base at
      # build time from `vite_base_api_url` in ui-image/build.nu. Both layers
      # must stay aligned. Do NOT use the legacy BASE_URL_OVERRIDE mechanism.
      - name: BASE_URL
        value: /opencost/model
      # UI_PATH is baked from the build arg; set explicitly so the serving path
      # is self-documenting in the Helm contract.
      - name: UI_PATH
        value: /opencost

# Disable built-in ingress — DigiOrg uses unified NGINX ingress
# oauth-proxy sidecar port registered in service for cross-namespace routing
service:
  enabled: true
  type: ClusterIP
  extraPorts:
    - name: oauth-proxy
      port: 4180
      targetPort: 4180
