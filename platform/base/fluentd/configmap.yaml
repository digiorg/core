apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
  labels:
    app: fluentd
    app.kubernetes.io/part-of: digiorg-core-platform
    app.kubernetes.io/component: logging
data:
  fluent.conf: |
    # ============================================================
    # INPUT: Container logs from all namespaces
    # ============================================================
    <source>
      @type tail
      @id in_tail_container_logs
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag raw.kubernetes.*
      read_from_head true
      <parse>
        @type multi_format
        <pattern>
          format json
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%NZ
        </pattern>
        <pattern>
          format /^(?<time>.+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
          time_format %Y-%m-%dT%H:%M:%S.%N%:z
        </pattern>
      </parse>
    </source>

    # ============================================================
    # INPUT: Prometheus metrics endpoint
    # ============================================================
    <source>
      @type prometheus
      bind 0.0.0.0
      port 24231
      metrics_path /metrics
    </source>

    <source>
      @type prometheus_output_monitor
      interval 10
    </source>

    # ============================================================
    # FILTER: Enrich with Kubernetes metadata
    # ============================================================
    <filter raw.kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
      kubernetes_url "#{ENV['KUBERNETES_URL'] || 'https://kubernetes.default.svc'}"
      skip_labels false
      skip_container_metadata false
      skip_namespace_metadata false
    </filter>

    # ============================================================
    # FILTER: Parse structured JSON logs, preserve plain-text logs
    # ============================================================
    <filter raw.kubernetes.**>
      @type parser
      key_name log
      reserve_data true
      remove_key_name_field false
      <parse>
        @type multi_format
        <pattern>
          format json
        </pattern>
        <pattern>
          format none
        </pattern>
      </parse>
    </filter>

    # ============================================================
    # FILTER: Prometheus metrics counter per namespace/pod/container
    # ============================================================
    <filter raw.kubernetes.**>
      @type prometheus
      <metric>
        name fluentd_input_records_total
        type counter
        desc Total number of log records collected
        <labels>
          namespace $.kubernetes.namespace_name
          pod $.kubernetes.pod_name
          container $.kubernetes.container_name
        </labels>
      </metric>
    </filter>

    # ============================================================
    # MATCH: Drop kube-system logs (high volume, low app value)
    # ============================================================
    <match raw.kubernetes.var.log.containers.**kube-system**.log>
      @type null
    </match>

    # ============================================================
    # OUTPUT: Forward to OpenSearch (Elasticsearch-compatible API)
    # ============================================================
    <match raw.kubernetes.**>
      @type opensearch
      @id out_opensearch
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}"
      scheme http
      ssl_verify false
      logstash_format true
      logstash_prefix "#{ENV['FLUENT_ELASTICSEARCH_LOGSTASH_PREFIX'] || 'digiorg-logs'}"
      include_tag_key true
      tag_key @log_name

      <buffer>
        @type file
        path /var/log/fluentd-buffers/kubernetes.system.buffer
        flush_mode interval
        retry_type exponential_backoff
        flush_thread_count 2
        flush_interval 5s
        retry_forever true
        retry_max_interval 30
        chunk_limit_size 2M
        queue_limit_length 8
        overflow_action block
      </buffer>
    </match>
