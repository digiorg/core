apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

resources:
  - rbac.yaml
  - log-schema-job.yaml
  - configmap.yaml
  - daemonset.yaml
  - service.yaml
  # Standalone compatibility. Independent delivery deletes this one ConfigMap
  # from the writer source and provides it from a separately pinned source,
  # within the same Fluentd Application (see log_dashboard_delivery.py).
  - ../log-dashboards
