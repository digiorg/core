apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-ism-retention-bootstrap
  namespace: platform-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch-ism-bootstrap
        app.kubernetes.io/part-of: digiorg-core-platform
        app.kubernetes.io/component: logging
    spec:
      restartPolicy: Never
      containers:
        - name: ism-bootstrap
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              OPENSEARCH_URL="http://opensearch-cluster-master.platform-db.svc.cluster.local:9200"
              POLICY_ID="digiorg-logs-retention-7d"

              echo "Checking OpenSearch connectivity at ${OPENSEARCH_URL} ..."
              curl -sf "${OPENSEARCH_URL}/_cluster/health" > /dev/null || {
                echo "ERROR: OpenSearch unreachable at ${OPENSEARCH_URL}" >&2
                exit 1
              }
              echo "OpenSearch is reachable."

              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "${OPENSEARCH_URL}/_plugins/_ism/policies/${POLICY_ID}")

              if [ "${HTTP_STATUS}" = "200" ]; then
                echo "ISM policy ${POLICY_ID} already exists — no action needed."
                exit 0
              fi

              echo "Creating ISM policy ${POLICY_ID} ..."
              curl -sf -X PUT "${OPENSEARCH_URL}/_plugins/_ism/policies/${POLICY_ID}" \
                -H 'Content-Type: application/json' \
                -d '{
                  "policy": {
                    "description": "Delete DigiOrg Fluentd log indices older than 7 days",
                    "default_state": "hot",
                    "states": [
                      {
                        "name": "hot",
                        "actions": [],
                        "transitions": [
                          {
                            "state_name": "delete",
                            "conditions": {
                              "min_index_age": "7d"
                            }
                          }
                        ]
                      },
                      {
                        "name": "delete",
                        "actions": [{"delete": {}}],
                        "transitions": []
                      }
                    ],
                    "ism_template": [
                      {
                        "index_patterns": ["digiorg-logs-*"],
                        "priority": 100
                      }
                    ]
                  }
                }'

              echo ""
              echo "ISM policy ${POLICY_ID} created successfully."
