# NATS Helm Values
# Chart: nats/nats
# https://github.com/nats-io/k8s/tree/main/helm/charts/nats

config:
  # Enable JetStream for persistent messaging
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      dir: /data
      pvc:
        enabled: true
        size: 1Gi
        # Match API-defaulted fields persisted inside StatefulSet
        # volumeClaimTemplates so Argo CD does not report false drift.
        merge:
          apiVersion: v1
          kind: PersistentVolumeClaim
          spec:
            volumeMode: Filesystem

  # Single-node for local dev (no clustering needed)
  cluster:
    enabled: false

  # NATS monitoring endpoint (used by Surveyor)
  monitor:
    port: 8222

  # System account required by NATS Surveyor for $SYS subject access
  # https://docs.nats.io/nats-server/configuration/sys_accounts
  merge:
    accounts:
      $SYS:
        users:
          - user: sys
            password: sys_password
      APP:
        jetstream: enabled
        users:
          - user: app

# Disable nats-box utility container (not needed)
natsBox:
  enabled: false

# Keep pod-template annotations non-null. Chart 2.14.2 otherwise renders
# `metadata.annotations: null`; Kubernetes drops that null map and Argo CD 3.4.5
# reports the StatefulSet OutOfSync after every successful apply (issue #279).
podTemplate:
  merge:
    metadata:
      annotations:
        platform.digiorg.io/component: nats

# Resource limits for the NATS container
# Use container.merge (not podTemplate.merge.spec.containers) to avoid
# generating a container entry without an image field (causes StatefulSet validation failure)
container:
  image:
    fullImageName: "nats:2.14.2-alpine@sha256:952d157e28d5394a211229bd57a7b37ff9f184e58e2c8486a08fa909fd254e32"
  merge:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Pin the chart's enabled config reloader sidecar.
reloader:
  image:
    fullImageName: "natsio/nats-server-config-reloader:0.23.0@sha256:64cb6c858e794906d3167378e02b7e0feb83c4e14c07b371eb8d921ef8c4a60b"
