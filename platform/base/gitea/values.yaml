# =============================================================================
# Gitea Helm Chart Values
# Chart: https://gitea.com/gitea/helm-chart
# =============================================================================

replicaCount: 1

# A single Gitea replica owns LevelDB-backed queues on the shared /data volume.
# RollingUpdate starts a second pod before terminating the first; the new pod
# cannot acquire the queue lock and the rollout deadlocks. Recreate is required
# for this single-writer persistent deployment.
strategy:
  type: Recreate

image:
  # Chart 12 changed the default registry/repository layout from the historical
  # Docker Hub-style gitea/gitea path. Pin the actual 1.26.1 OCI index so the
  # rendered image is reproducible and pullable.
  registry: docker.gitea.com
  repository: gitea
  tag: "1.26.1"
  digest: "sha256:d8667667b4ccbd1f67b86a376bffcc0a17b16cf71309ed04e3918231776d47dd"
  pullPolicy: IfNotPresent
  rootless: false

# Disable built-in PostgreSQL — use shared platform-db instance
postgresql:
  enabled: false

# Disable built-in PostgreSQL HA (default-enabled in chart 12.x)
postgresql-ha:
  enabled: false

# Chart 12.x replaced the bundled Redis with Valkey; valkey-cluster is enabled by
# default. Gitea here uses in-process session/cache (memory) + level queue, so no
# Valkey is needed — disable both bundled subcharts (Issue #275).
valkey-cluster:
  enabled: false
valkey:
  enabled: false

# Persistence for Git repositories
persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

# Gitea configuration (app.ini)
gitea:
  admin:
    # Admin user created on first startup
    # Password from secret, username here for reference
    username: gitea_admin
    existingSecret: gitea-admin-secret
  
  # Environment variables injected into ALL containers (including init containers)
  # This is required for database password to be available during configure-gitea init
  # See: https://gitea.com/gitea/helm-gitea#user-defined-environment-variables-in-appini
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-secrets
          key: POSTGRES_PASSWORD
  
  config:
    APP_NAME: "DigiOrg Git"
    
    server:
      DOMAIN: digiorg.local
      ROOT_URL: "https://digiorg.local/gitea/"
      SSH_DOMAIN: digiorg.local
      SSH_PORT: 22
      # Run behind reverse proxy with subpath
      PROTOCOL: http
      HTTP_PORT: 3000
      # Required for subpath deployment behind ingress
      SERVE_FROM_SUB_PATH: true
    
    database:
      DB_TYPE: postgres
      HOST: postgresql.platform-db.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
      # Password injected via gitea.additionalConfigFromEnvs (GITEA__database__PASSWD)
      # This ensures the password is available in init containers for migrations

    security:
      INSTALL_LOCK: true
      SECRET_KEY: ""  # Auto-generated if empty
    
    service:
      # Disable local registration — users are created via Keycloak OIDC
      DISABLE_REGISTRATION: true
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      ENABLE_NOTIFY_MAIL: false
    
    # Session configuration
    session:
      PROVIDER: memory
    
    # Cache configuration (use memory for local dev)
    cache:
      ADAPTER: memory
    
    # Queue configuration
    queue:
      TYPE: level
    
    # OAuth2 auto-registration
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      ACCOUNT_LINKING: login
      USERNAME: nickname
    
    # Enable Gitea Actions
    actions:
      ENABLED: true

  # Chart 12.x nests probes below `gitea`; top-level probe keys are ignored.
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 200
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Note: Database password is injected via gitea.additionalConfigFromEnvs above,
# NOT via extraEnvVars. extraEnvVars only applies to the main container,
# but the configure-gitea init container needs the password for migrations.

# Trust the local ingress CA declaratively in both the main Gitea container and
# the chart's init containers. Project only the public certificate.
extraVolumes:
  - name: digiorg-local-ca
    secret:
      secretName: digiorg-local-ca
      items:
        - key: ca.crt
          path: digiorg-local-ca.crt

extraContainerVolumeMounts:
  - name: digiorg-local-ca
    mountPath: /etc/gitea/trusted-cas
    readOnly: true

extraInitVolumeMounts:
  - name: digiorg-local-ca
    mountPath: /etc/gitea/trusted-cas
    readOnly: true

deployment:
  env:
    - name: SSL_CERT_FILE
      value: /etc/gitea/trusted-cas/digiorg-local-ca.crt

# Optional Helm test hook defaults to busybox:latest in chart 12.x. Disable it;
# platform smoke tests are run by the dedicated validation workflow instead.
test:
  enabled: false

# Ingress disabled — using platform-wide ingress
ingress:
  enabled: false

# Service configuration
service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
