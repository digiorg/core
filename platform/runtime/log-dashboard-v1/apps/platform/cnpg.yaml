apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 9 (Issue #283): CNPG is OPTIONAL, future hosted-application database
    # infrastructure — no internal platform component depends on it (Keycloak,
    # Backstage, Gitea, SonarQube and Harbor permanently use legacy PostgreSQL).
    # Both the operator and Cluster Applications are script-driven (no
    # automated sync). `main up` therefore creates only their Application CRs;
    # `nu scripts/local-setup.nu future-infra` explicitly promotes the operator
    # and then the Cluster after core bootstrap. See
    # docs/guides/cnpg-future-app-database.md.
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    # Issue #275 approved baseline (bumped from 0.22.0), revalidated against
    # https://cloudnative-pg.github.io/charts and Helm-rendered with these values.
    targetRevision: 0.29.0
    helm:
      releaseName: cnpg
      values: |
        # CloudNativePG Helm values for local development
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    # Issue #283: deliberately manual. A late sync-wave orders Application CR
    # creation only; it does not keep an automated child from consuming
    # resources during core bootstrap.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
