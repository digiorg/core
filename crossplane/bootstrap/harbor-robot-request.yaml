# Issue #285 architecture decision #5: a least-privilege Harbor identity for
# Crossplane's AppClaim pipeline to create per-app Harbor projects and their
# scoped CI robot accounts. The Harbor admin credential itself (harbor-admin-secret)
# is NEVER referenced by the AppClaim Composition — only this one-time,
# declarative Request is, and only to mint the narrower "crossplane-system"
# system robot below. This is provisioned exactly once (deletionPolicy: Orphan)
# through the same pinned provider-http mechanism the Composition itself uses
# (crossplane/providers/packages/provider-http.yaml, v1.0.14), reusing already
# schema-verified machinery instead of a bespoke imperative bootstrap path.
#
# Harbor RBAC (validated against goharbor/harbor v2.15.1 — the appVersion
# pinned by platform/base/harbor's chart — src/common/rbac/const.go and
# src/controller/robot/controller.go convertScope/validatePermissions, which
# document "/system => Kind: system Namespace: /" and "/project/* => Kind:
# project Namespace: *" as the two permission shapes a *system*-level robot
# may hold):
#   - {kind: system,  namespace: "/", access: [{resource: project, action: create}]}
#     grants ONLY the ability to create new Harbor projects; no delete, no
#     user/registry/system configuration, no scanning administration.
#   - {kind: project, namespace: "*", access: [{resource: robot, action: create|read}, {resource: artifact, action: read}, {resource: repository, action: push|pull}]}
#     grants creating/reading project-scoped robot accounts, reading artifact
#     metadata, and only the two repository actions that Harbor v2.15.1
#     requires a creator robot to possess before it may delegate the same
#     push/pull actions to a per-app CI robot. The permission-subset check is
#     enforced by src/server/v2.0/handler/robot.go isValidPermissionScope.
#     These project permissions apply across projects because, at the moment
#     this system robot creates a new per-app robot or checks a freshly-pushed
#     artifact, that project's own robots cannot yet be relied on — a
#     namespace-scoped grant naming one project cannot work here. Issue #285
#     (automatic image promotion):
#     `artifact: read` is the exact permission goharbor/harbor v2.15.1
#     src/server/v2.0/handler/artifact.go GetArtifact requires
#     (`RequireProjectAccess(ctx, project, rbac.ActionRead,
#     rbac.ResourceArtifact)`) — this is what lets the AppClaim pipeline
#     Composition's per-service Harbor artifact Request confirm a
#     CI-pushed, commit-SHA-tagged image exists (and read its digest) before
#     promoting it into a Deployment. The control-plane robot holds repository
#     push/pull solely because Harbor requires those actions at delegation time;
#     ordinary image operations use the separate per-app robot credential
#     injected by the Composition.
# This remains strictly narrower than the Harbor admin credential: it cannot
# delete/update repositories or artifacts, cannot manage users, registries,
# replication, GC, or system configuration.
apiVersion: http.crossplane.io/v1alpha2
kind: Request
metadata:
  name: harbor-crossplane-system-robot
spec:
  deletionPolicy: Orphan
  # Issue #285 (stdout12 live evidence): provider-http v1.0.14's packaged CRD
  # (package/crds/http.crossplane.io_requests.yaml) declares
  # `spec.managementPolicies` with `default: ["*"]`. This Application is applied
  # with ServerSideApply=true, so the API server attributes that schema default
  # to Argo's own field manager in .metadata.managedFields -- Argo's
  # managed-fields diff normalizer keeps it in the live comparison, Git never
  # declared it, and the Request stays OutOfSync forever (proven twice: the
  # Application's own operation Succeeded and went Healthy while this single
  # resource never converged, until the gated-sync budget expired). Declaring
  # the API default verbatim is the whole correction -- deliberately NOT an
  # ignoreDifferences rule, which would also blind the diff to real drift of
  # the least-privilege permission payload below. `["*"]` is the full
  # observe/create/update/delete set this one-time bootstrap already relied on.
  managementPolicies: ["*"]
  # The other three CRD defaults need no such treatment: deletionPolicy and
  # every keyMapping's missingFieldStrategy are declared explicitly (below),
  # and providerConfigRef.policy is an object with no default of its own, so
  # the API server never materialises it and never defaults .policy.resolution
  # while it stays absent -- confirmed live (rendered none).
  providerConfigRef:
    name: default
  forProvider:
    headers:
      Content-Type:
        - application/json
      Authorization:
        - "Basic {{ harbor-admin-basic-auth:harbor:value }}"
    payload:
      # Issue #285 (TLS hardening): the trusted digiorg.local ingress, not
      # the raw in-cluster harbor-core Service address. The shared
      # provider-http ProviderConfig (crossplane/providers/configs/provider-
      # http-config.yaml) carries spec.tls.caCertSecretRef for the CA this
      # host's certificate chains to.
      baseUrl: "https://digiorg.local/api/v2.0"
      body: |
        {
          "name": "crossplane-system",
          "description": "Issue 285: least-privilege system robot used by the AppClaim pipeline Composition (crossplane-contrib/provider-http) to create per-app Harbor projects and their CI robot accounts. Never reused as a per-app credential.",
          "duration": -1,
          "level": "system",
          "permissions": [
            {
              "kind": "system",
              "namespace": "/",
              "access": [
                {"resource": "project", "action": "create"}
              ]
            },
            {
              "kind": "project",
              "namespace": "*",
              "access": [
                {"resource": "robot", "action": "create"},
                {"resource": "robot", "action": "read"},
                {"resource": "artifact", "action": "read"},
                {"resource": "repository", "action": "push"},
                {"resource": "repository", "action": "pull"}
              ]
            }
          ]
        }
    mappings:
      - method: "POST"
        action: CREATE
        url: .payload.baseUrl + "/robots"
        body: .payload.body
      # Runtime blocker (crash-safe identity): a numeric-ID-based OBSERVE
      # (GET /robots/{id} using an ID cached from a prior CREATE response)
      # cannot rediscover this robot if the Request's .status is ever lost
      # (e.g. the object is deleted and recreated after Harbor already
      # accepted the CREATE POST) -- the cached ID is gone with it, and a
      # fresh reconcile would fall through to CREATE again. Harbor's
      # `GET /robots` LIST endpoint (goharbor/harbor v2.15.1
      # src/server/v2.0/handler/robot.go ListRobot) defaults to system-level
      # scope (ProjectID=0) whenever the `Level` query keyword is omitted --
      # exactly this robot's own level, with no numeric project ID needed
      # (unlike the AppClaim pipeline's per-app *project*-level robot, which
      # Harbor's ListRobot forces to require a numeric ProjectID a single
      # provider-http mapping cannot resolve -- see
      # core-catalog/tests/test_harbor_robot_hardening.py). `action: OBSERVE`
      # is explicit for the same requestmapping.GetMapping reason documented
      # in core-catalog/tests/test_provider_http_mapping_contract.py.
      #
      # Issue #285 final blocker (round-4 review): `q=Name=~...` is Harbor's
      # fuzzy/substring query syntax -- it matched by SUBSTRING against every
      # robot's stored name Harbor-wide, so a global decoy could occupy the
      # single page provider-http can fetch ahead of the canonical robot
      # (the `page_size=100` + truncation-guard machinery this used to carry
      # only bounded that risk, it never removed it). Verified against
      # goharbor/harbor v2.15.1 source (fetched into /tmp/harbor-v2151):
      # `src/lib/q/builder.go` `parsePattern` takes a bare value (no leading
      # `~`) down the EXACT-match branch (`escapeValue`, a direct DB
      # predicate) -- `~value` is the separate fuzzy branch. `controller.go`
      # `populate()` prepends `config.RobotPrefix(ctx)` only to the Robot
      # struct returned to the caller; the DB row `ListRobot`/`BuildQuery`
      # actually filters (`model.Robot.Name`) never carries it, and `Create`
      # only prefixes `name` with the project name for project-level robots
      # -- this system-level robot's stored name is the bare declared
      # `"crossplane-system"`. So `q=Name=crossplane-system` (exact) filters
      # server-side on the same bare name this Request declares, and under
      # Harbor's own `unique_robot UNIQUE(name, project_id)` constraint at
      # the implicit `ProjectID=0` this OBSERVE already resolves to, it can
      # only ever return the one canonical row or `[]` -- no global decoy,
      # and no pagination boundary, can appear in the response at all. That
      # is the whole fix: `page_size` and the truncation guard below are
      # gone because they no longer protect against anything reachable.
      - method: "GET"
        action: OBSERVE
        url: .payload.baseUrl + "/robots?q=Name=crossplane-system"
      # Issue #301: Harbor v2.15.1 requires a creator robot to possess every
      # permission it delegates. Existing clusters therefore need a real
      # permission UPDATE, not another CREATE (which would violate Harbor's
      # unique robot identity). Harbor's robot update is PUT /robots/{id}; it
      # leaves the credential unchanged. provider-http v1.0.14 retains a
      # top-level JSON array response as a string, while it eagerly decodes the
      # object-valued payload.body. The UPDATE expressions normalize both
      # boundaries explicitly. provider-http also retries invalid generated
      # details with
      # status.cache.response; every uncertain current response therefore renders
      # a valid non-numeric sentinel URL plus empty body. That prevents cache
      # fallback while Harbor rejects the request before any robot mutation.
      - method: "PUT"
        action: UPDATE
        url: |-
          def normalizedBody:
            if (.response.body | type) == "string"
            then try (.response.body | fromjson) catch null
            else .response.body
            end;
          def normalizedDesired:
            if (.payload.body | type) == "string"
            then try (.payload.body | fromjson) catch null
            else .payload.body
            end;
          normalizedBody as $body |
          normalizedDesired as $desired |
          if (.response.statusCode==200)
             and (($body|type)=="array") and (($body|length)==1)
             and (($body[0]|type)=="object")
             and (($body[0].id|type)=="number")
             and ($body[0].id > 0)
             and ($body[0].id == ($body[0].id | floor))
             and (($body[0].name|type)=="string")
             and ($body[0].name | test("^[^$]+\\$crossplane-system$"))
             and ($body[0].level=="system")
             and (($body[0].description|type)=="string")
             and (($body[0].duration|type)=="number")
             and (($body[0].disable|type)=="boolean")
             and (($desired|type)=="object")
             and (($desired.permissions|type)=="array")
          then .payload.baseUrl + "/robots/" + ($body[0].id | tostring)
          else .payload.baseUrl + "/robots/provider-http-refused-noncanonical-observe"
          end
        body: |-
          def normalizedBody:
            if (.response.body | type) == "string"
            then try (.response.body | fromjson) catch null
            else .response.body
            end;
          def normalizedDesired:
            if (.payload.body | type) == "string"
            then try (.payload.body | fromjson) catch null
            else .payload.body
            end;
          normalizedBody as $body |
          normalizedDesired as $desired |
          if (.response.statusCode==200)
             and (($body|type)=="array") and (($body|length)==1)
             and (($body[0]|type)=="object")
             and (($body[0].id|type)=="number")
             and ($body[0].id > 0)
             and ($body[0].id == ($body[0].id | floor))
             and (($body[0].name|type)=="string")
             and ($body[0].name | test("^[^$]+\\$crossplane-system$"))
             and ($body[0].level=="system")
             and (($body[0].description|type)=="string")
             and (($body[0].duration|type)=="number")
             and (($body[0].disable|type)=="boolean")
             and (($desired|type)=="object")
             and (($desired.permissions|type)=="array")
          then {
            name: $body[0].name,
            description: $body[0].description,
            duration: $body[0].duration,
            level: $body[0].level,
            disable: $body[0].disable,
            permissions: $desired.permissions
          }
          else {}
          end
    # Runtime blocker (crash-safe identity), continued: rather than trusting
    # a bare 2xx status (the DEFAULT check), these CUSTOM checks verify the
    # LIST response actually contains an item with this robot's exact
    # intended identity (name suffix + level=system + both permission
    # entries, nothing more/less).
    #
    # Issue #285 provider boundary: provider-http v1.0.14's
    # `internal/service/request/requestgen/request_generator.go`
    # `GenerateRequestContext` calls `internal/json/util.go`
    # `ConvertJSONStringsToMaps`, whose `IsJSONString` unmarshals only into
    # `map[string]interface{}`. It therefore leaves a top-level JSON array
    # response as a string. Each CUSTOM check normalizes that body at its
    # boundary with fail-closed `try ... fromjson ... catch null`, while
    # retaining compatibility with an already-decoded array. The provider
    # tag's go.mod pins github.com/itchyny/gojq v0.12.17; that exact
    # dependency registers `fromjson` in `func.go` and covers array decoding
    # in `cli/test.yaml` ("fromjson function"). Both paths are exercised in
    # core/platform/tests/test_harbor_bootstrap_crash_safety.py. A
    # mismatched/uncertain response (wrong permissions, empty list, non-200)
    # is reported as both "not synced" and "not removed" once provider-http
    # has an observed object/status -- it must never be silently trusted as up
    # to date, but must also never be misreported as removed (that would
    # re-trigger CREATE against a name Harbor's own `unique_robot
    # UNIQUE(name, project_id)` constraint, confirmed via
    # make/migrations/postgresql/0004_1.8.0_schema.up.sql, already holds).
    #
    # provider-http v1.0.14 initial-state boundary: while Request status is
    # empty, IsUpToDate converts any non-2xx initial OBSERVE to ObjectNotFound
    # before either CUSTOM check runs, so Crossplane invokes CREATE. This
    # provider behavior cannot be changed by a response-check expression. It
    # remains mutation-safe here: if the canonical robot already exists,
    # Harbor's unique constraint rejects the duplicate without replacing the
    # robot or its secret; if it is genuinely absent, CREATE applies exactly
    # the least-privilege payload declared above. The UPDATE sentinel protects
    # the separate existing-status/cache path.
    isRemovedCheck:
      type: CUSTOM
      # Issue #285 final blocker (round-4 review): now that the OBSERVE
      # above is Harbor's server-side EXACT `Name` match (not fuzzy), the
      # response body is structurally bounded to the one canonical row or
      # `[]` (see the OBSERVE mapping's comment for the full builder.go/
      # controller.go citation) -- there is no decoy or truncated page left
      # for a per-item identity scan to defend against, so this check
      # collapses to exactly what the response shape can prove: a confirmed
      # HTTP 200, well-formed, EMPTY array. `not` of the whole success
      # predicate is deliberately avoided (the pre-#285 shape) because that
      # would turn every error/malformed response (401, 500, a non-array
      # body) into "removed" too -- an uncertain response must never be
      # reported as removed, only a provable absence may (matching
      # expectedResponseCheck's own fail-closed "not synced" on the same
      # uncertain inputs). A NONEMPTY response -- whether it is the one
      # correct row, or a shape Harbor's own `unique_robot
      # UNIQUE(name, project_id)` constraint makes impossible for this exact
      # query (>1 item, or an item that doesn't actually match) -- is
      # therefore never treated as removed either: it falls through to
      # "not removed", and expectedResponseCheck alone decides whether it is
      # synced.
      logic: |-
        def normalizedBody:
          if (.response.body | type) == "string"
          then try (.response.body | fromjson) catch null
          else .response.body
          end;
        normalizedBody as $body |
        (.response.statusCode == 200) and (($body|type)=="array") and (($body|length) == 0)
    expectedResponseCheck:
      type: CUSTOM
      # Issue #285 review finding: exact least-privilege enforcement. Each
      # `select(...)` previously only asserted the required actions were
      # present via `any(...)`, never that the access array held *only*
      # those actions -- so a drifted robot granted an extra action (e.g.
      # `robot:delete`) alongside the required ones was silently trusted as
      # synced. Each select now also pins `(.access // []) | length ==` the
      # exact expected count, so any extra action fails the match (and the
      # robot correctly falls through to "not synced").
      #
      # Issue #285 final blocker (round-4 review): under the OBSERVE's
      # server-side EXACT `Name` match, a synced response can only ever be
      # exactly one item (Harbor's own `unique_robot UNIQUE(name,
      # project_id)` constraint at the implicit `ProjectID=0` this OBSERVE
      # resolves to -- see the OBSERVE mapping's comment). The check now
      # requires `length == 1` explicitly rather than scanning with `any(...)`
      # over an unbounded array: `>1` items (impossible for a genuine
      # response, but never trusted if it occurred) and `0` items both fall
      # through to "not synced" here, matching isRemovedCheck's fail-closed
      # treatment of the same non-canonical shapes. Identity is still EXACT
      # on the single item: Harbor stores robots under an admin-configurable
      # prefix terminated by `$` (`populate()` in goharbor/harbor v2.15.1
      # src/controller/robot/controller.go, which adds it only to the response,
      # never to what's queried). A non-empty `$`-terminated prefix is required,
      # then stripped; the remainder must equal the declared name exactly.
      logic: |-
        def normalizedBody:
          if (.response.body | type) == "string"
          then try (.response.body | fromjson) catch null
          else .response.body
          end;
        def canonicalName(r): (r.name // "") | sub("^[^$]*\\$"; "");
        def hasCanonicalPrefix(r): r.name != null and (r.name | test("^[^$]+\\$"));
        def hasArrayOfObjects(v): (v | type) == "array" and (v | all(type == "object"));
        def isCrossplaneSystemRobot(r):
          hasCanonicalPrefix(r) and (canonicalName(r) == "crossplane-system")
          and r.level == "system"
          and hasArrayOfObjects(r.permissions // [])
          and (r.permissions // [] | length) == 2
          and ([r.permissions[]? | (.access // [])[]? | select((.effect // "") != "")] | length) == 0
          and ([r.permissions[] | select(hasArrayOfObjects(.access // []) and .kind=="system" and .namespace=="/" and ((.access // []) | length) == 1 and ((.access // []) | any(.resource=="project" and .action=="create")))] | length) == 1
          and ([r.permissions[] | select(hasArrayOfObjects(.access // []) and .kind=="project" and .namespace=="*" and ((.access // []) | length) == 5 and ((.access // []) | any(.resource=="robot" and .action=="create")) and ((.access // []) | any(.resource=="robot" and .action=="read")) and ((.access // []) | any(.resource=="artifact" and .action=="read")) and ((.access // []) | any(.resource=="repository" and .action=="push")) and ((.access // []) | any(.resource=="repository" and .action=="pull")))] | length) == 1;
        normalizedBody as $body |
        (.response.statusCode == 200) and (($body|type)=="array") and (($body|length) == 1) and (isCrossplaneSystemRobot($body[0]))
    secretInjectionConfigs:
      - secretRef:
          name: crossplane-harbor-credentials
          namespace: crossplane-system
        keyMappings:
          # Plain field extraction for the raw robot identity/secret (parity
          # with the AppClaim pipeline's per-app harbor-robot secret
          # injection), plus one *computed* key: gojq (itchyny/gojq v0.12.17,
          # provider-http's vendored jq engine — confirmed via its go.mod) is
          # a full jq implementation, so `@base64` string-interpolation is
          # valid here. provider-http's `{{ name:namespace:key }}` templating
          # substitutes a secret value verbatim (it does not encode), and
          # Harbor's own Basic-auth scheme requires base64(name:secret) — so
          # the pre-encoded pair is computed once here rather than asking the
          # AppClaim Composition to do HTTP-auth encoding it cannot perform.
          #
          # Runtime blocker (secret preservation): Harbor's OBSERVE response
          # (a LIST, above) never carries `secret` (only CREATE's response
          # does -- confirmed against goharbor/harbor v2.15.1's handler,
          # which only ever populates `secret` on `CreateRobot`). Without
          # `missingFieldStrategy: preserve` (default: "delete"), every
          # OBSERVE reconcile after the first would delete the
          # already-injected secret/basicAuth keys from this Secret. Each JQ
          # mapping additionally returns null unless the response is the same
          # complete, successful Harbor CREATE result (HTTP 201, canonical
          # robot name, and a typed nonempty secret). This makes the three-key
          # update atomic: partial/error/UPDATE responses preserve every old
          # value instead of mixing credential generations or synthesizing
          # base64("null:null").
          - secretKey: name
            responseJQ: |-
              def validCreate:
                (.statusCode==201)
                and ((.body|type)=="object")
                and ((.body.name|type)=="string")
                and (.body.name | test("^[^$]+\\$crossplane-system$"))
                and ((.body.secret|type)=="string") and ((.body.secret|length)>0);
              if validCreate then .body.name else null end
            missingFieldStrategy: preserve
          - secretKey: secret
            responseJQ: |-
              def validCreate:
                (.statusCode==201)
                and ((.body|type)=="object")
                and ((.body.name|type)=="string")
                and (.body.name | test("^[^$]+\\$crossplane-system$"))
                and ((.body.secret|type)=="string") and ((.body.secret|length)>0);
              if validCreate then .body.secret else null end
            missingFieldStrategy: preserve
          - secretKey: basicAuth
            responseJQ: |-
              def validCreate:
                (.statusCode==201)
                and ((.body|type)=="object")
                and ((.body.name|type)=="string")
                and (.body.name | test("^[^$]+\\$crossplane-system$"))
                and ((.body.secret|type)=="string") and ((.body.secret|length)>0);
              if validCreate
              then "\(.body.name):\(.body.secret)" | @base64
              else null
              end
            missingFieldStrategy: preserve
